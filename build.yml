cat > ~/exe/.github/workflows/build.yml << 'EOF'
name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller requests markdown2 duckduckgo-search g4f
      - run: pyinstaller --noconfirm --onefile --console --icon=ai.ico --name CIS_AI_Chat --add-data "py.py;." start.py
      - uses: actions/upload-artifact@v4
        with:
          name: CIS_AI_Chat_EXE
          path: dist/CIS_AI_Chat.exe
EOF
